name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare secrets missing::Skipping deploy. Add GitHub Secrets: ${missing[*]}. See README → GitHub Actions 自动部署."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.configured == 'true'
        run: |
          if [ -n "$WORKER_PASSWORD" ]; then
            npm run deploy -- --var "PASSWORD:$WORKER_PASSWORD"
          else
            npm run deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_PASSWORD: ${{ secrets.WORKER_PASSWORD }}
