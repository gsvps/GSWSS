name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Embed Windows manifest
        working-directory: client
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          rsrc -manifest cmd/gs/app.manifest -o cmd/gs/rsrc.syso -arch amd64

      - name: Build gs.exe
        working-directory: client
        run: |
          go mod tidy
          go test ./...
          $version = "${{ github.ref_name }}".TrimStart("v")
          go build -ldflags "-s -w -H windowsgui -X github.com/gswss/gs-protocol/client/internal/version.Version=$version -X github.com/gswss/gs-protocol/client/internal/version.Build=${{ github.sha }}" -o ../dist/windows-amd64/gs.exe ./cmd/gs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows-amd64/gs.exe
          generate_release_notes: true
