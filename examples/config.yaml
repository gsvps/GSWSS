# GS Protocol Client 配置示例
# 复制为 config.yaml 并填入你的 Worker 地址与密码

# server 路径须与 Worker wrangler.toml [vars] WEBSOCKET_PATH 一致
server: https://your-worker.workers.dev/ws

# 须与 Worker wrangler.toml [vars] PASSWORD 一致
password: your-secret-password

local_socks: 127.0.0.1:1080

local_http: 127.0.0.1:7890

tls: true

# 心跳间隔（秒）
heartbeat: 30

log_level: info
